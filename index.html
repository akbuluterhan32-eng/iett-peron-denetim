<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İETT Peron Denetim Sistemi</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Arial,sans-serif;background:#f3f4f7;color:#131b26;margin:0}#app{max-width:900px;margin:auto;padding-bottom:60px}.top{background:#0b2545;color:#fff;padding:20px}.top h1{margin:5px 0;font-size:22px}.ey{color:#f2a900;font-size:12px;font-weight:bold}.sec{padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.btn{border:0;border-radius:8px;padding:11px 15px;background:#1d5fd6;color:white;font-weight:bold;cursor:pointer}.btn.secondary{background:white;color:#0b2545;border:1px solid #ddd}.btn.danger{background:#c93b3b}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:bold;color:#5b6570;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions .btn{flex:1}.code{display:inline-block;background:#f2a900;padding:4px 9px;border-radius:5px;font-family:monospace;font-weight:bold}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{color:#5b6570;font-size:13px}.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.status button{padding:9px;border:1px solid #ddd;border-radius:7px;background:white;font-weight:bold}.ok.on{background:#e8f5ee;border-color:#1f8355;color:#1f8355}.bad.on{background:#fbeaea;border-color:#c93b3b;color:#c93b3b}.na.on{background:#eef0f3}.note{display:none}.note.on{display:block;margin-top:7px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.modal.on{display:flex}.modalbox{background:white;border-radius:12px;padding:24px;text-align:center;width:300px}.qr{display:flex;justify-content:center;margin:15px}.hidden{display:none}.issue{padding:8px 0;border-bottom:1px dashed #ddd}.loading{text-align:center;padding:30px}.history-item{cursor:pointer}.history-item:hover{border-color:#1d5fd6}</style></head><body><div id="app"></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><script>
const SITE_URL='https://akbuluterhan32-eng.github.io/iett-peron-denetim/';const SUPABASE_URL='https://pukakcwtlnmyqhpofwaj.supabase.co';const SUPABASE_KEY='sb_publishable_wIBpW_yz2pgtxTwPx1fHqQ_IKsRNBsT';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const ITEMS=[['Genel Güvenlik ve Zemin','Zemin kaygan değil, çatlak veya çukur bulunmuyor mu?'],['Genel Güvenlik ve Zemin','Aydınlatma yeterli mi ve tüm armatürler çalışıyor mu?'],['Genel Güvenlik ve Zemin','Güvenlik kamerası mevcut mu ve çalışır durumda mı?'],['Genel Güvenlik ve Zemin','Bariyer / korkuluk sağlam ve eksiksiz mi?'],['Bekleme ve Konfor','Oturma bankları sağlam ve yeterli sayıda mı?'],['Bekleme ve Konfor','Üstü kapalı bekleme alanı (durak kulübesi/gölgelik) mevcut mu?'],['Bekleme ve Konfor','Çöp kutusu mevcut mu?'],['Bekleme ve Konfor','Reklam panoları ve durak camları sağlam mı?'],['Bilgilendirme Sistemleri','Hat numarası ve güzergah levhası güncel ve okunaklı mı?'],['Bilgilendirme Sistemleri','Elektronik bilgilendirme ekranı (varsa) çalışıyor mu?'],['Bilgilendirme Sistemleri','Sesli anons sistemi çalışıyor mu?'],['Bilgilendirme Sistemleri','Peron numarası / durak adı net şekilde görünüyor mu?'],['Erişilebilirlik','Tekerlekli sandalye ile perona erişim mümkün mü?'],['Erişilebilirlik','Görme engelliler için kabartmalı yönlendirme yüzeyi mevcut mu?'],['Erişilebilirlik','Rampa eğimi uygun ve zemini sağlam mı?'],['Erişilebilirlik','Sesli bilgilendirme mevcut mu?'],['Temizlik ve Bakım','Zemin ve oturma alanları temiz mi?'],['Temizlik ve Bakım','Kötü koku veya haşere şikayeti bulunuyor mu?'],['Temizlik ve Bakım','Yangın söndürücü mevcut mu ve muayene tarihi geçerli mi?'],['Acil Durum Hazırlığı','Acil durum iletişim numarası görünür şekilde asılı mı?'],['Acil Durum Hazırlığı','İlk yardım noktası bilgisi mevcut mu?'],['Çevre ve Erişim Yolları','Bisiklet / motosiklet park alanı düzenli mi (varsa)?'],['Çevre ve Erişim Yolları','Çevre aydınlatma direği sağlam ve dik durumda mı?'],['Çevre ve Erişim Yolları','Uygun görüş aynası mevcut mu?'],['Çevre ve Erişim Yolları','Peron çıkışında trafik lambası var mı?'],['Çevre ve Erişim Yolları','Yaya geçidi mevcut mu ve güvenli şekilde kullanılabilir durumda mı?'],['Çevre ve Erişim Yolları','Uyarı tabelaları mevcut mu, görünür ve anlaşılır mı?']];
const $=id=>document.getElementById(id),key='iett_peron_list';function list(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}}function save(x){localStorage.setItem(key,JSON.stringify(x))}function fmt(t){return new Date(t).toLocaleString('tr-TR')}function toast(x){alert(x)}function home(){location.hash='';renderHome()}
function renderHome(){let ps=list();let cards=ps.map(p=>`<div class="card"><div class="row"><div><span class="code">${p.code}</span><h3>${p.name}</h3></div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="go('${p.id}')">Denetim Başlat</button><button class="btn secondary" onclick="qr('${p.id}')">QR Kod</button><button class="btn danger" onclick="removePeron('${p.id}')">Peron Alanını Kaldır</button></div></div>`).join('');$('app').innerHTML=`<div class="top"><div class="ey">İETT · PERON DENETİM SİSTEMİ</div><h1>Peron Denetim Paneli</h1></div><div class="sec"><button class="btn" onclick="toggleAdd()">+ Yeni Peron Alanı Ekle</button><div id="add" class="card hidden"><div class="field"><label>Peron Adı</label><input id="pn" placeholder="Örn. Kağıthane Peron 1"></div><button class="btn" onclick="addPeron()">Peron Ekle</button></div><h3>Peronlar</h3>${cards||'<div class="card">Henüz peron eklenmedi.</div>'}</div>`}function toggleAdd(){$('add').classList.toggle('hidden')}function addPeron(){let n=$('pn').value.trim();if(!n)return toast('Peron adını girin');let ps=list();let id=(crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now());ps.push({id,name:n,code:'P'+String(ps.length+1).padStart(2,'0')});save(ps);renderHome()}function removePeron(id){let p=list().find(x=>x.id===id);if(!p)return;if(!confirm(`"${p.name}" peron alanını kaldırmak istediğinizden emin misiniz?`))return;save(list().filter(x=>x.id!==id));renderHome()}
function go(id){let p=list().find(x=>x.id===id);location.hash='peron='+encodeURIComponent(id)+'&name='+encodeURIComponent(p?p.name:'Peron')+'&code='+encodeURIComponent(p?p.code:'')}
function current(){let q=new URLSearchParams(location.hash.replace(/^#/,''));return{id:q.get('peron'),name:q.get('name')||'Peron',code:q.get('code')||''}}
function qr(id){let p=list().find(x=>x.id===id);if(!p)return;if(typeof QRCode==='undefined')return toast('QR kütüphanesi yüklenemedi. Sayfayı yenileyip tekrar deneyin.');$('modalbox').innerHTML=`<span class="code">${p.code}</span><h3>${p.name}</h3><div id="q" class="qr"></div><p class="small">Telefonla okutulduğunda bu peronun denetim ekranı ve geçmiş denetimleri açılır.</p><button class="btn secondary" onclick="closeQr()">Kapat</button>`;new QRCode($('q'),{text:SITE_URL+'#peron='+encodeURIComponent(p.id)+'&name='+encodeURIComponent(p.name)+'&code='+encodeURIComponent(p.code),width:200,height:200});$('modal').classList.add('on')}function closeQr(){$('modal').classList.remove('on')}
function renderCheck(id){let q=current(),local=list().find(x=>x.id===id),p=local||{id,name:q.name,code:q.code};if(!p)return home();let s={};ITEMS.forEach((x,i)=>s[i]={v:null,n:''});$('app').innerHTML=`<div class="top"><div class="ey">İETT · PERON DENETİM ÇEK LİSTESİ</div><h1>${p.name}</h1></div><div class="sec"><div class="card"><span class="code">${p.code}</span><div class="actions" style="margin-top:12px"><button class="btn secondary" onclick="showHistory('${p.id}')">📋 Geçmiş Denetimler</button></div><div class="field"><label>Denetçi Adı Soyadı</label><input id="ins" placeholder="Ad Soyad"></div><div class="field"><label>Denetim Tarihi</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div id="items"></div><div class="card"><label>Genel Notlar</label><textarea id="gn" placeholder="Ek gözlemler..."></textarea></div><button class="btn" id="submit" disabled>Denetimi Kaydet</button><button class="btn secondary" style="margin-left:8px" onclick="home()">Panele Dön</button></div>`;let html='',cat='';ITEMS.forEach((x,i)=>{if(x[0]!==cat){cat=x[0];html+=`<h3>${cat}</h3>`}html+=`<div class="card"><b>${x[1]}</b><div class="status" style="margin-top:9px"><button class="ok" onclick="st(${i},'ok',this)">✓ Uygun</button><button class="bad" onclick="st(${i},'bad',this)">✕ Uygun Değil</button><button class="na" onclick="st(${i},'na',this)">— Gözlemlenemedi</button></div><textarea class="note" id="n${i}" placeholder="Açıklama"></textarea></div>`});$('items').innerHTML=html;window._state=s;window._peron=p;window._update=()=>{$('submit').disabled=ITEMS.some((x,i)=>!s[i].v)};window._update();$('submit').onclick=()=>submitCheck()}
function st(i,v,b){window._state[i].v=v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('n'+i).classList.toggle('on',v==='bad');window._update()}
async function submitCheck(){let ins=$('ins').value.trim();if(!ins)return toast('Denetçi adını girin');let items=ITEMS.map((x,i)=>({cat:x[0],label:x[1],status:_state[i].v,note:$('n'+i).value.trim()}));let ok=items.filter(x=>x.status==='ok').length,bad=items.filter(x=>x.status==='bad').length;let rec={peronId:_peron.id,peronName:_peron.name,peronCode:_peron.code,inspector:ins,date:$('date').value,ts:Date.now(),score:ok+bad?Math.round(ok/(ok+bad)*100):null,generalNotes:$('gn').value.trim(),items};let {error}=await db.from('peron_deneyimler').insert({peron_id:rec.peronId,peron_code:rec.peronCode,peron_name:rec.peronName,inspector:rec.inspector,inspection_date:rec.date,score:rec.score,general_notes:rec.generalNotes,items:rec.items});if(error){console.error(error);return toast('Denetim kaydedilemedi. İnternet bağlantısını kontrol edin.')}localStorage.setItem('denetim:'+rec.peronId+':'+rec.ts,JSON.stringify(rec));result(rec)}
function result(r){let issues=r.items.filter(x=>x.status==='bad');$('app').innerHTML=`<div class="top"><div class="ey">DENETİM KAYDEDİLDİ</div><h1>${r.peronName}</h1></div><div class="sec"><div class="card" style="text-align:center"><span class="code">${r.peronCode}</span><h1>${r.score===null?'—':r.score+'%'}</h1><div class="small">${r.inspector} · ${fmt(r.ts)}</div>${issues.length?'<h3>Uygun Olmayan Maddeler</h3>'+issues.map(x=>`<div class="issue">${x.label}${x.note?' — '+x.note:''}</div>`).join(''):'<p>Tüm maddeler uygun bulundu.</p>'}</div><div class="actions"><button class="btn" onclick="renderCheck('${r.peronId}')">Yeni Denetim</button><button class="btn secondary" onclick="showHistory('${r.peronId}')">Geçmiş Denetimler</button><button class="btn secondary" onclick="home()">Panele Dön</button></div></div>`}
async function showHistory(id){let q=current(),local=list().find(x=>x.id===id),p=local||{id,name:q.name,code:q.code};$('app').innerHTML=`<div class="top"><div class="ey">İETT · GEÇMİŞ DENETİMLER</div><h1>${p.name}</h1></div><div class="sec"><div class="loading">Denetimler yükleniyor...</div></div>`;let {data,error}=await db.from('peron_deneyimler').select('*').eq('peron_id',id).order('created_at',{ascending:false});if(error){$('app').innerHTML=`<div class="sec"><div class="card">Geçmiş denetimler yüklenemedi. İnternet bağlantısını kontrol edin.</div><button class="btn secondary" onclick="renderCheck('${id}')">Geri Dön</button></div>`;return}let cards=data.length?data.map(r=>`<div class="card history-item" onclick="showHistoryDetail(${r.id})"><div class="row"><div><span class="code">${r.peron_code}</span><h3>${r.inspection_date}</h3><div class="small">Denetçi: ${r.inspector}</div></div><strong>${r.score===null?'—':r.score+'%'}</strong></div><div class="small" style="margin-top:8px">Detayları görmek için dokunun →</div></div>`).join(''):'<div class="card">Bu perona ait henüz kayıtlı denetim bulunmuyor.</div>';$('app').innerHTML=`<div class="top"><div class="ey">İETT · GEÇMİŞ DENETİMLER</div><h1>${p.name}</h1></div><div class="sec">${cards}<div class="actions"><button class="btn" onclick="renderCheck('${id}')">Yeni Denetim</button><button class="btn secondary" onclick="home()">Panele Dön</button></div></div>`}
async function showHistoryDetail(id){let {data,error}=await db.from('peron_deneyimler').select('*').eq('id',id).single();if(error||!data)return toast('Denetim detayı yüklenemedi.');let good=data.items.filter(x=>x.status==='ok').length,bad=data.items.filter(x=>x.status==='bad').length,na=data.items.filter(x=>x.status==='na').length;let groups='',cat='';data.items.forEach(x=>{if(x.cat!==cat){cat=x.cat;groups+=`<h3>${cat}</h3>`}groups+=`<div class="card"><b>${x.label}</b><div style="margin-top:8px">${x.status==='ok'?'✓ Uygun':x.status==='bad'?'✕ Uygun Değil':'— Gözlemlenemedi'}${x.note?`<div class="small" style="margin-top:5px">Açıklama: ${x.note}</div>`:''}</div></div>`});$('app').innerHTML=`<div class="top"><div class="ey">DENETİM DETAYI</div><h1>${data.peron_name}</h1></div><div class="sec"><div class="card"><span class="code">${data.peron_code}</span><p><b>Tarih:</b> ${data.inspection_date}</p><p><b>Denetçi:</b> ${data.inspector}</p><p><b>Sonuç:</b> ${data.score===null?'—':data.score+'%'}</p><p><b>Uygun:</b> ${good} &nbsp; <b>Uygun Değil:</b> ${bad} &nbsp; <b>Gözlemlenemedi:</b> ${na}</p>${data.general_notes?`<p><b>Genel Not:</b> ${data.general_notes}</p>`:''}</div>${groups}<button class="btn secondary" onclick="showHistory('${data.peron_id}')">Geçmiş Denetimlere Dön</button></div>`}
function route(){let q=current();if(q.id)renderCheck(q.id);else renderHome()}window.onhashchange=route;route();
</script></body></html>
