<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>İETT Peron Denetim Sistemi</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><style>body{font-family:Arial,sans-serif;background:#f3f4f7;color:#131b26;margin:0}#app{max-width:900px;margin:auto;padding-bottom:60px}.top{background:#0b2545;color:#fff;padding:20px}.top h1{margin:5px 0;font-size:22px}.ey{color:#f2a900;font-size:12px;font-weight:bold}.sec{padding:20px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:16px;margin:12px 0}.btn{border:0;border-radius:8px;padding:11px 15px;background:#1d5fd6;color:white;font-weight:bold;cursor:pointer}.btn.secondary{background:white;color:#0b2545;border:1px solid #ddd}.field{margin:10px 0}.field label{display:block;font-size:13px;font-weight:bold;color:#5b6570;margin-bottom:5px}.field input,.field textarea{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.actions{display:flex;gap:8px}.actions .btn{flex:1}.code{display:inline-block;background:#f2a900;padding:4px 9px;border-radius:5px;font-family:monospace;font-weight:bold}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.small{color:#5b6570;font-size:13px}.status{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}.status button{padding:9px;border:1px solid #ddd;border-radius:7px;background:white;font-weight:bold}.ok.on{background:#e8f5ee;border-color:#1f8355;color:#1f8355}.bad.on{background:#fbeaea;border-color:#c93b3b;color:#c93b3b}.na.on{background:#eef0f3}.note{display:none}.note.on{display:block;margin-top:7px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.modal.on{display:flex}.modalbox{background:white;border-radius:12px;padding:24px;text-align:center;width:300px}.qr{display:flex;justify-content:center;margin:15px}.hidden{display:none}.issue{padding:8px 0;border-bottom:1px dashed #ddd}</style></head><body><div id="app"></div><div id="modal" class="modal"><div class="modalbox" id="modalbox"></div></div><script>
const SITE_URL='https://akbuluterhan32-eng.github.io/iett-peron-denetim/';
const ITEMS=[['Genel Alan','Peron alanı temiz ve düzenli mi?'],['Genel Alan','Zemin ve yürüme alanlarında tehlike var mı?'],['Güvenlik','Aydınlatma yeterli ve çalışır durumda mı?'],['Güvenlik','Güvenlik ekipmanları görünür ve erişilebilir mi?'],['Bilgilendirme','Durak/peron tabelaları mevcut ve okunabilir mi?'],['Bilgilendirme','Hat ve yönlendirme bilgileri doğru mu?'],['Erişilebilirlik','Engelli erişim alanı uygun durumda mı?'],['Erişilebilirlik','Biniş alanı güvenli ve erişilebilir mi?']];
const $=id=>document.getElementById(id), key='iett_peron_list';
function list(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch(e){return []}} function save(x){localStorage.setItem(key,JSON.stringify(x))} function fmt(t){return new Date(t).toLocaleString('tr-TR')} function toast(x){alert(x)}
function home(){location.hash='';renderHome()}
function renderHome(){let ps=list();let cards=ps.map(p=>`<div class="card"><div class="row"><div><span class="code">${p.code}</span><h3>${p.name}</h3><div class="small">${p.route||''}</div></div></div><div class="actions" style="margin-top:12px"><button class="btn" onclick="go('${p.id}')">Denetim Başlat</button><button class="btn secondary" onclick="qr('${p.id}')">QR Kod</button></div></div>`).join('');$('app').innerHTML=`<div class="top"><div class="ey">İETT · PERON DENETİM SİSTEMİ</div><h1>Peron Denetim Paneli</h1></div><div class="sec"><button class="btn" onclick="toggleAdd()">+ Yeni Peron Alanı Ekle</button><div id="add" class="card hidden"><div class="field"><label>Peron Adı</label><input id="pn" placeholder="Örn. Kağıthane Peron 1"></div><div class="field"><label>Hat / Açıklama</label><input id="pr" placeholder="Örn. 48 - Kağıthane"></div><button class="btn" onclick="addPeron()">Peron Ekle</button></div><h3>Peronlar</h3>${cards||'<div class="card">Henüz peron eklenmedi.</div>'}</div>`}
function toggleAdd(){$('add').classList.toggle('hidden')} function addPeron(){let n=$('pn').value.trim();if(!n)return toast('Peron adını girin');let ps=list();let id=(crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now());ps.push({id,name:n,route:$('pr').value.trim(),code:'P'+String(ps.length+1).padStart(2,'0')});save(ps);renderHome()}
function go(id){location.hash='peron='+encodeURIComponent(id)} function current(){return new URLSearchParams(location.hash.replace(/^#/,'')).get('peron')}
function qr(id){let p=list().find(x=>x.id===id);if(!p)return;if(typeof QRCode==='undefined')return toast('QR kütüphanesi yüklenemedi. Sayfayı yenileyip tekrar deneyin.');$('modalbox').innerHTML=`<span class="code">${p.code}</span><h3>${p.name}</h3><div id="q" class="qr"></div><p class="small">Telefonla okutulduğunda bu peronun denetim ekranı açılır.</p><button class="btn secondary" onclick="closeQr()">Kapat</button>`;new QRCode($('q'),{text:SITE_URL+'#peron='+encodeURIComponent(id),width:200,height:200});$('modal').classList.add('on')}function closeQr(){$('modal').classList.remove('on')}
function renderCheck(id){let p=list().find(x=>x.id===id);if(!p)return home();let s={};ITEMS.forEach((x,i)=>s[i]={v:null,n:''});$('app').innerHTML=`<div class="top"><div class="ey">İETT · PERON DENETİM ÇEK LİSTESİ</div><h1>${p.name}</h1><div>${p.route||''}</div></div><div class="sec"><div class="card"><span class="code">${p.code}</span><div class="field"><label>Denetçi Adı Soyadı</label><input id="ins" placeholder="Ad Soyad"></div><div class="field"><label>Denetim Tarihi</label><input id="date" type="date" value="${new Date().toISOString().slice(0,10)}"></div></div><div id="items"></div><div class="card"><label>Genel Notlar</label><textarea id="gn" placeholder="Ek gözlemler..."></textarea></div><button class="btn" id="submit" disabled>Denetimi Kaydet</button><button class="btn secondary" style="margin-left:8px" onclick="home()">Panele Dön</button></div>`;let html='';let cat='';ITEMS.forEach((x,i)=>{if(x[0]!==cat){cat=x[0];html+=`<h3>${cat}</h3>`}html+=`<div class="card"><b>${x[1]}</b><div class="status" style="margin-top:9px"><button class="ok" onclick="st(${i},'ok',this)">✓ Uygun</button><button class="bad" onclick="st(${i},'bad',this)">✕ Uygun Değil</button><button class="na" onclick="st(${i},'na',this)">— Gözlemlenemedi</button></div><textarea class="note" id="n${i}" placeholder="Açıklama"></textarea></div>`});$('items').innerHTML=html;window._state=s;window._peron=p;window._update=()=>{$('submit').disabled=ITEMS.some((x,i)=>!s[i].v)};window._update();$('submit').onclick=()=>submitCheck()}
function st(i,v,b){window._state[i].v=v;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('n'+i).classList.toggle('on',v==='bad');window._state[i].n=$('n'+i).value;window._update()}
function submitCheck(){let ins=$('ins').value.trim();if(!ins)return toast('Denetçi adını girin');let items=ITEMS.map((x,i)=>({cat:x[0],label:x[1],status:_state[i].v,note:$('n'+i).value.trim()}));let ok=items.filter(x=>x.status==='ok').length,bad=items.filter(x=>x.status==='bad').length;let rec={peronId:_peron.id,peronName:_peron.name,peronCode:_peron.code,inspector:ins,date:$('date').value,ts:Date.now(),score:ok+bad?Math.round(ok/(ok+bad)*100):null,generalNotes:$('gn').value.trim(),items};localStorage.setItem('denetim:'+rec.peronId+':'+rec.ts,JSON.stringify(rec));result(rec)}
function result(r){let issues=r.items.filter(x=>x.status==='bad');$('app').innerHTML=`<div class="top"><div class="ey">DENETİM KAYDEDİLDİ</div><h1>${r.peronName}</h1></div><div class="sec"><div class="card" style="text-align:center"><span class="code">${r.peronCode}</span><h1>${r.score===null?'—':r.score+'%'}</h1><div class="small">${r.inspector} · ${fmt(r.ts)}</div>${issues.length?'<h3>Uygun Olmayan Maddeler</h3>'+issues.map(x=>`<div class="issue">${x.label}${x.note?' — '+x.note:''}</div>`).join(''):'<p>Tüm maddeler uygun bulundu.</p>'}</div><div class="actions"><button class="btn" onclick="renderCheck('${r.peronId}')">Yeni Denetim</button><button class="btn secondary" onclick="home()">Panele Dön</button></div></div>`}
function route(){let id=current();if(id)renderCheck(id);else renderHome()}window.onhashchange=route;route();
</script></body></html>
